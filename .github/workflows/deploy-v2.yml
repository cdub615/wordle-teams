name: Deploy v2 (beta)

# Builds and deploys the v2 replatform to beta.wordleteams.com on any push that
# touches v2/. The v1 Next.js app on Vercel is untouched by this workflow, and
# Vercel's own auto-deploy of dev is untouched by it too — the two pipelines
# share a repository and nothing else.

on:
  push:
    branches: [dev, main, feat/v2-replatform]
    paths:
      - 'v2/**'
      - '.github/workflows/deploy-v2.yml'
  # PULL REQUESTS RUN THE GATES AND DEPLOY NOTHING. Every deploy step below is
  # guarded on `github.event_name == 'push'`, and that guard is load-bearing
  # rather than tidy: this repository is PUBLIC, so without it a fork's pull
  # request would run `convex deploy` and `wrangler deploy` against real
  # credentials.
  pull_request:
    branches: [dev, main]
    paths:
      - 'v2/**'
      - '.github/workflows/deploy-v2.yml'
  workflow_dispatch:

# Two pushes in quick succession would otherwise race two `convex deploy` runs
# at the same deployment and two `wrangler deploy` runs at the same Worker,
# leaving whichever finished last in charge regardless of which was newer.
# Queue them instead — and do NOT cancel in progress: a half-applied Convex
# schema push is worse than a slightly delayed one.
concurrency:
  group: deploy-v2
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2

    steps:
      - uses: actions/checkout@v7

      # Must precede setup-node: `cache: pnpm` needs the pnpm binary to exist
      # before it can resolve the store path.
      #
      # No `version:` on purpose — the version comes from packageManager in
      # v2/package.json, and passing both is a hard error ("Multiple versions
      # of pnpm specified").
      #
      # package_json_file must be spelled out because
      # `defaults.run.working-directory` applies only to `run:` steps, never to
      # `uses:` steps. Left at its default this action reads the ROOT
      # package.json, which pins pnpm@11.13.0 — a release pnpm has since marked
      # broken, and which CI's self-installer refuses outright. Pointing at v2's
      # own manifest also honours the island rule: v2 owns its toolchain.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: v2/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: v2/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # Ahead of the tests because it is the cheaper failure, and because the
      # rule it exists for is a deploy-safety one: nothing but convex/email.ts
      # may import the Resend client, which is what keeps real mail away from
      # throwaway e2e addresses (wordle-teams-96l, wordle-teams-9lh). A lint
      # config nobody runs enforces nothing, which is why this step exists at
      # all rather than just the config.
      - name: Lint
        run: pnpm lint

      # NOTHING ELSE HERE TYPECHECKS. `vite build` transpiles and strips types,
      # it does not check them, so before this step a type error reached beta so
      # long as the tests passed — the only thing catching one was somebody
      # remembering to run tsc by hand (wordle-teams-px4).
      #
      # It also catches a stale routeTree.gen.ts: the vite plugin regenerates it
      # on build, so a new route that was never committed typechecks green
      # locally after a build and fails here, which is the right way round.
      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:once

      # ---------------------------------------------------------------------
      # END TO END, AND WHY IT IS HERE AT ALL (wordle-teams-z6v4).
      #
      # Until this landed, Playwright ran in NO workflow. Seven mutants were
      # planted against the onboarding card's dashboard wiring and FIVE survived
      # every gate above — the card could be deleted from /app outright and lint,
      # typecheck, vitest and build all stayed green. The e2e suite was the only
      # thing that could see it, and it was a thing somebody ran by hand.
      #
      # IT SITS BEFORE EVERY DEPLOY STEP ON PURPOSE. A red spec must stop the
      # deploy, not be discovered after beta already has the bundle.
      #
      # NO SECRETS AND NO CLOUD BACKEND. The whole sequence was measured on
      # wordle-teams-es9c: CONVEX_AGENT_MODE=anonymous provisions a LOCAL Convex
      # backend, and the suite passes against it with neither BETTER_AUTH_SECRET
      # nor RESEND_API_KEY nor any POLAR_* or VAPID_* value set. billing.spec.ts
      # included — no spec has to be excluded, and no live Polar token goes near
      # this pipeline.
      # ---------------------------------------------------------------------

      - name: Cache the Convex local backend binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/convex
          key: convex-backend-${{ runner.os }}-${{ hashFiles('v2/pnpm-lock.yaml') }}
          restore-keys: convex-backend-${{ runner.os }}-

      - name: Install the Chromium Playwright drives
        run: pnpm exec playwright install --with-deps chromium

      # THREE THINGS HERE COST A CI RUN EACH TO FIND. Do not simplify any of them
      # without reading wordle-teams-es9c.
      #
      # 1. `convex init` SCAFFOLDS convex/tsconfig.json, a file this repo does
      #    not have and does not want. It sets no allowImportingTsExtensions,
      #    and convex/ imports with explicit .ts extensions throughout, so the
      #    push dies with dozens of TS5097 errors. Delete it; `convex dev` does
      #    not write it back.
      #
      # 2. SITE_URL IS SET BEFORE THE FUNCTIONS ARE PUSHED. convex/auth.ts throws
      #    at MODULE SCOPE when it is falsy and a push evaluates the module, so
      #    the reverse order fails as auth.ts loads. That is the same throw the
      #    dist/client grep below looks for, met from the other end.
      #    E2E_TEST_MODE=true or every signIn() fails at testOtps.takeFor.
      #
      # 3. THE BACKEND DOES NOT SURVIVE A STEP BOUNDARY, which is why the suite
      #    runs in this step rather than the next one. `convex dev --once` pushes
      #    and exits and its backend dies with the step; SSR then answers 500
      #    with `Network connection lost.` and Playwright reports it three
      #    minutes later as a webServer timeout naming nothing useful. What
      #    disguises it is that any convex CLI command STARTS the backend on
      #    demand — so a `convex env list` in a following step silently revives
      #    one, prints the variables and lets it die again, making provisioning
      #    look perfectly healthy. Hence a watcher held open here, and an
      #    explicit assertion that 3210 answers before anything runs.
      - name: End-to-end against a local Convex backend
        env:
          CONVEX_AGENT_MODE: anonymous
        run: |
          set -euo pipefail

          pnpm exec convex init
          rm -f convex/tsconfig.json
          pnpm exec convex env set SITE_URL http://localhost:3000
          pnpm exec convex env set E2E_TEST_MODE true

          pnpm exec convex dev > /tmp/convex-dev.log 2>&1 &

          for i in $(seq 1 90); do
            if grep -q 'Convex functions ready' /tmp/convex-dev.log 2>/dev/null; then
              echo "backend ready and functions pushed after ${i}s"
              break
            fi
            sleep 1
          done

          curl -sf --max-time 10 http://127.0.0.1:3210/version > /dev/null
          echo "backend answering on 3210"

          set +e
          pnpm e2e
          E2E_STATUS=$?
          set -e

          # useLocalCapture SWALLOWS a failed write by design, so a rejected
          # mutation is indistinguishable from an effect that never ran unless
          # the server log is visible. Printing it is what ruled the environment
          # out when settings.spec.ts failed in CI and nowhere else.
          echo "=================== convex dev log ==================="
          tail -80 /tmp/convex-dev.log || true
          exit $E2E_STATUS

      - name: Keep the Playwright report when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            v2/playwright-report
            v2/test-results
          retention-days: 7

      # THE MOST DANGEROUS LINE IN THIS FILE IS THE ONE THAT WOULD BE MISSING
      # HERE. `convex init` above WRITES v2/.env.local, and it points at the
      # local backend:
      #
      #     CONVEX_DEPLOYMENT=anonymous:anonymous-agent
      #     VITE_CONVEX_URL=http://127.0.0.1:3210
      #     VITE_CONVEX_SITE_URL=http://127.0.0.1:3211
      #
      # Vite loads .env.local in EVERY mode, production included. Left in place,
      # the `pnpm build` inside the deploy step below would inline
      # http://127.0.0.1:3210 into the client bundle and beta would ship pointing
      # at a backend that exists only on a dead runner — every request failing
      # for every visitor, with a green pipeline.
      #
      # A fresh checkout has no .env.local at all, so deleting it restores
      # exactly the state the deploy step was written against: build-time values
      # come from the committed .env.production, and the Convex URL from
      # --cmd-url-env-var-name. This is a RESTORATION, not a workaround.
      - name: Remove the local-backend env before anything is built or deployed
        run: |
          set -euo pipefail
          rm -f .env.local
          test ! -e .env.local
          echo "removed v2/.env.local — the build below uses .env.production"

      # Pushes schema + functions, then runs the client build with
      # VITE_CONVEX_URL set to the deployment this key points at, so the bundle
      # can never be built against the wrong Convex. The other build-time values
      # come from the committed v2/.env.production.
      # THE UPLOAD FAILS SILENTLY WITHOUT THIS, which is why it is a step and not
      # a comment. The Sentry plugin warns and skips when it has no token, and it
      # DELETES THE CLIENT MAPS ANYWAY -- deletion is not conditional on the
      # upload succeeding. So the whole pipeline goes green, beta serves correctly,
      # nothing leaks, and Sentry quietly has no maps. That is the worst shape of
      # failure and it already happened once, on the commit that added the plugin.
      #
      # WHAT THIS DOES AND DOES NOT CATCH, stated so nobody trusts it further than
      # it goes: it catches an ABSENT token -- secret deleted, renamed, or (the
      # actual cause) never passed into the build step's env. It does NOT catch an
      # INVALID or expired token, which would still warn-and-skip. Asserting that
      # would mean querying Sentry with sentry-cli, which is present only as a
      # transitive dependency with no bin link.
      - name: The Sentry auth token must be present before the build
        if: github.event_name == 'push'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SENTRY_AUTH_TOKEN:-}" ]; then
            echo "::error::SENTRY_AUTH_TOKEN is empty, so source maps will be built,"
            echo "deleted, and never uploaded -- silently. Set the repository secret."
            echo "See v2/vite.config.ts (sentryTanstackStart) and wordle-teams-p1as."
            exit 1
          fi
          echo "present: SENTRY_AUTH_TOKEN is set (validity is not checked here)"

      - name: Deploy Convex and build the client
        if: github.event_name == 'push'
        run: pnpm exec convex deploy --cmd 'pnpm build' --cmd-url-env-var-name VITE_CONVEX_URL
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          # THE SOURCE MAP UPLOAD HAPPENS INSIDE THIS STEP, because it is a Vite
          # plugin and this is where `pnpm build` runs. A repository secret is
          # NOT automatically visible to a step, so without this line the plugin
          # warns "No auth token provided", skips the upload -- AND STILL DELETES
          # THE MAPS, because the deletion is not conditional on the upload
          # succeeding. That combination is silent: every gate passes, beta is
          # correct, no map leaks, and Sentry simply has nothing. It happened
          # exactly once, on the commit that added the plugin (wordle-teams-p1as).
          #
          # The token is a REAL secret, unlike SENTRY_DSN which is public by
          # design and lives in wrangler.jsonc. Org and project slugs are not
          # secret and are inline in v2/vite.config.ts.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      # THE CHECK THAT WOULD HAVE CAUGHT THE 2026-09-06 BETA OUTAGE, and it sits
      # BEFORE the Worker deploy on purpose: a bundle carrying this fault never
      # reaches beta at all, rather than being caught after everyone can see it.
      #
      # convex/auth.ts THROWS AT MODULE SCOPE when process.env.SITE_URL is
      # falsy — which in a browser it always is. A module-scope throw is a side
      # effect, so no bundler may tree-shake it away: one frontend import of
      # anything that transitively reaches auth.ts drags the whole module into a
      # client chunk, and the route owning that chunk dies on load. It happened
      # for real — src/components/chat/composer.tsx imported one integer from
      # convex/lib/chat.ts, which imports ../access.ts, which imports ./auth.ts
      # (56d4b88) — and /chat was dead on beta for an afternoon.
      #
      # NO OTHER STEP HERE CAN SEE IT. Lint inspects specifiers, not the graph
      # behind them; tsc and vitest never evaluate a browser bundle; `vite build`
      # emits the broken chunk happily, because a module-scope throw is valid
      # JavaScript. The fault lives in the SHAPE of the emitted bundle, so the
      # emitted bundle is the only place it can be looked for.
      #
      # The throw string is the fingerprint: measured present in dist/client
      # before that fix and absent after. Nothing legitimate puts it in a browser
      # bundle, so a match is always this bug.
      - name: The auth module must not reach the client bundle
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          if grep -rl 'SITE_URL is not set' dist/client/; then
            echo "::error::A client chunk contains convex/auth.ts's module-scope throw."
            echo "Some frontend import reaches convex/access.ts or convex/auth.ts."
            echo "Frontend constants belong in convex/lib/chatLimits.ts, which imports nothing."
            exit 1
          fi
          echo "clean: no module-scope auth throw in dist/client"

      # The insights corpus is ~79 KB and must stay a STATIC FILE the CDN serves,
      # fetched only when the insights route renders. `import`ing it instead would
      # inline it into a JS chunk and every visitor would download the corpus
      # whether or not they ever open insights -- invisibly, with every gate green.
      # insights-corpus.test.ts catches the cause (an import in the source); this
      # catches the effect, which is the thing that actually ships.
      # THE SOURCE MAPS ARE UPLOADED TO SENTRY AND THEN DELETED, and dist/client
      # is the PUBLIC asset directory (dist/server/wrangler.json sets
      # assets.directory to "../client"). So a .map surviving here is the entire
      # source tree on a public URL — the one way wordle-teams-p1as could make
      # things worse instead of better.
      #
      # The deletion is the Sentry plugin's `filesToDeleteAfterUpload`, and it
      # runs even when the upload is skipped (verified locally with no auth
      # token). This guards the case where that stops being true: a plugin
      # upgrade, someone setting `sourcemaps.disable`, or the option being
      # dropped while `build.sourcemap` stays on — which is exactly the
      # combination that switches the automatic deletion off.
      #
      # dist/server maps are DELIBERATELY KEPT and are not checked here: that
      # directory is worker code, served to nobody, and its maps are what
      # wrangler's `upload_source_maps` finally has to upload.
      - name: No source map may reach the client bundle
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          found=$(find dist/client -name '*.map' | head -20)
          if [ -n "$found" ]; then
            echo "::error::Source maps survived into the PUBLIC asset directory."
            echo "$found"
            echo "These would be served from beta/production and expose the source."
            echo "See v2/vite.config.ts: sentryTanstackStart's filesToDeleteAfterUpload."
            exit 1
          fi
          echo "clean: no .map in dist/client"

      - name: The insights corpus must not reach the client bundle
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          if [ ! -f dist/client/insights/benchmark-openers.json ]; then
            echo "::error::dist/client/insights/benchmark-openers.json is missing."
            echo "public/insights/ is checked in and copied by vite. Run"
            echo "  node scripts/build-insights-corpus.mjs"
            echo "and commit the result."
            exit 1
          fi
          # The first three openers in rank order. Present in a JS asset means the
          # artifact was inlined rather than fetched.
          if grep -rl 'slantclastalist' dist/client/assets/ 2>/dev/null; then
            echo "::error::A client chunk contains the packed opener corpus."
            echo "Something imports public/insights/benchmark-openers.json instead"
            echo "of fetching it. Use loadInsightsBenchmark() in src/lib/insights-benchmark.ts."
            exit 1
          fi
          echo "clean: insights corpus is a static file, not a bundled chunk"

      # Publishes the Worker and keeps the beta.wordleteams.com custom domain
      # binding declared in v2/wrangler.jsonc. Uploads dist/ from the build above.
      - name: Deploy the Worker
        if: github.event_name == 'push'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: v2
          command: deploy

      # RENAMED FROM "Smoke test beta", AND THE NAME IS HALF THE FIX. This proves
      # that ONE signed-out route renders its own content, and nothing whatever
      # about any authenticated screen. The old name invited exactly the reading
      # that let /chat stay dead on beta with this step green.
      #
      # IT USED TO ASSERT ONLY A STATUS CODE, WHICH A BROKEN APP RETURNS. A React
      # error boundary catching a thrown ConvexError still answers 200 carrying
      # an error page, and the body — the only place the evidence lives — went to
      # /dev/null. So it now keeps the body and asserts on it: the sign-in form's
      # own copy must be present, and neither error boundary's heading may be.
      # ("Something went wrong!" is TanStack's default, rendered by any route
      # without an errorComponent; "Ruh roh, something went wrong!" is
      # src/components/dashboard-error.tsx. One case-insensitive substring
      # catches both.)
      #
      # -a ON EVERY grep, and it is not decoration: the served HTML carries bytes
      # grep reads as binary (typographic ellipses in the copy), and without -a
      # it prints "binary file matches" and reports a match count of 0.
      #
      # WHY NOT AN AUTHENTICATED CHECK, which is the other half of the hole.
      # Signing in from CI would need to read an OTP back through
      # convex/testOtps.ts, which is gated on E2E_TEST_MODE — and that flag is
      # deliberately NOT set on beta (see convex/reminders.ts, which names it as
      # what stands between a config slip and mailing real people, and
      # convex/e2eSeed.ts, which says the same). Turning it on to make this step
      # possible would trade a real mail-safety guarantee for a smoke test. The
      # alternative, parking a genuine account's credentials in CI secrets, puts
      # a standing login for the live app in the deploy pipeline. Neither is
      # worth it, so the check stays signed-out — and the step above is what
      # actually catches the class of bug an authenticated one was wanted for,
      # earlier and without any of that.
      #
      # THE /chat PROBE IS DELIBERATELY MODEST. A 307 to /login proves the route
      # exists and its beforeLoad guard ran — that the non-split half of the
      # route module loads server-side and refuses an anonymous visitor. It says
      # NOTHING about the lazily loaded component chunk, which is where the
      # 2026-09-06 fault actually was. Do not read it as "chat works".
      - name: Smoke test beta (signed-out routes only)
        if: github.event_name == 'push'
        run: |
          set -euo pipefail

          body=$(mktemp)
          code=$(curl -sS -o "$body" -w '%{http_code}' --max-time 30 https://beta.wordleteams.com/login)
          echo "beta.wordleteams.com/login -> $code"
          test "$code" = "200"

          if grep -aqi 'something went wrong' "$body"; then
            echo "::error::/login answered 200 but rendered an error boundary."
            exit 1
          fi
          grep -aq 'Sign in' "$body"
          grep -aq 'Send code' "$body"
          echo "/login rendered the sign-in form, not an error page"

          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 https://beta.wordleteams.com/chat)
          echo "beta.wordleteams.com/chat (no session) -> $code"
          test "$code" = "307"
