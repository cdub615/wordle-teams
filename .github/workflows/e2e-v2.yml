name: e2e v2 (spike)

# TEMPORARY, AND IT DELETES ITSELF INTO deploy-v2.yml.
#
# This exists to answer the last open questions on wordle-teams-es9c in the
# environment they actually matter in, because they cannot be answered on the
# workstation: wordle-teams-4j4y means a clean checkout of v2 will not install
# there at all. Once these steps run green, they move into deploy-v2.yml's
# single job (wordle-teams-wdpi) and this file goes away — it is NOT the
# finished arrangement, and it must not outlive the spike, because a second job
# means a second `pnpm install` on a second runner and the owner's constraint on
# this whole piece of work is GitHub Actions minutes.
#
# TRIGGERED BY ITS OWN PATH, WHICH IS NOT THE OBVIOUS CHOICE AND IS THE ONLY ONE
# THAT WORKS HERE. workflow_dispatch was tried first and cannot be used: GitHub
# resolves a dispatch against the DEFAULT branch, and this file is not on main
# (`HTTP 404: workflow e2e-v2.yml not found on the default branch`). Putting it
# on main to make a temporary spike runnable would be worse than the problem.
#
# So iteration is one push per attempt, and the paths filter is what keeps that
# cheap: this runs ONLY when this file itself changes, never on an ordinary v2
# push. It therefore does not double the cost of normal work, and it does not
# deploy anything — deploy-v2.yml's own paths filter does not match this file.
#
# The consequence to know while iterating: a fix in v2/ will NOT re-run this on
# its own. Touch this file in the same commit.

on:
  push:
    branches: [feat/v2-replatform]
    paths:
      - '.github/workflows/e2e-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2

    steps:
      - uses: actions/checkout@v7

      # Same three-step toolchain setup as deploy-v2.yml, and package_json_file
      # matters for the same reason it does there: `defaults.run` does not apply
      # to `uses:` steps, and the ROOT package.json pins pnpm 11.13.0, a release
      # pnpm has marked broken. v2 owns its toolchain.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: v2/package.json

      # NODE 22 IS LOAD-BEARING HERE, not merely consistent with the deploy job.
      # The Convex local backend refuses to deploy "use node" actions on Node 25
      # (DeploymentNotConfiguredForNodeActions), and convex/ has seven modules
      # that declare it — http.ts, chatNotify.ts, push.ts, polar.ts, pushSend.ts
      # among them. This is why the sequence below cannot be developed against a
      # workstation default of 25.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: v2/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # The local backend is a downloaded binary, cached under ~/.cache/convex
      # rather than in the repo. Keyed on the convex version because that is what
      # decides which binary is fetched.
      - name: Cache the Convex local backend binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/convex
          key: convex-backend-${{ runner.os }}-${{ hashFiles('v2/pnpm-lock.yaml') }}
          restore-keys: convex-backend-${{ runner.os }}-

      - name: Install the Chromium Playwright drives
        run: pnpm exec playwright install --with-deps chromium

      # THE WHOLE POINT OF THE SPIKE, and every line of it was measured on a
      # clean clone before being written here.
      #
      # NO LOGIN, NO CLOUD, NO DEPLOY KEY. CONVEX_AGENT_MODE=anonymous is what
      # makes `convex` provision a local backend non-interactively; the CLI's own
      # help suggests exactly this sequence. Nothing here can reach
      # fabulous-goldfish-949 — there is no CONVEX_DEPLOY_KEY in the environment
      # and no .env.local in a fresh checkout, which is precisely the pair that
      # makes a bare `convex dev` on the workstation target production instead.
      #
      # `convex init` WRITES A tsconfig THAT BREAKS THE PUSH, and deleting it is
      # not optional. It scaffolds v2/convex/tsconfig.json — a file this repo
      # does not have — with no allowImportingTsExtensions, and convex/ imports
      # with explicit .ts extensions throughout, so the push fails with dozens of
      # TS5097 errors across access.ts, auth.ts, teams.ts and the rest. Measured:
      # delete it and the identical push succeeds in 3s, and `convex dev` does
      # not write it back.
      #
      # SITE_URL IS SET BEFORE THE PUSH, NOT AFTER, and the ordering is the whole
      # reason these are separate steps. convex/auth.ts throws at MODULE SCOPE
      # when it is falsy, and a push evaluates the module — so a push that
      # precedes this fails as auth.ts loads. Same throw deploy-v2.yml greps
      # dist/client for, met from the other end.
      #
      # E2E_TEST_MODE=true or every signIn() fails at testOtps.takeFor, which is
      # the gate that makes the OTP readable at all.
      - name: Start a local Convex backend and push the functions
        env:
          CONVEX_AGENT_MODE: anonymous
        run: |
          set -euo pipefail
          pnpm exec convex init
          rm -f convex/tsconfig.json
          pnpm exec convex env set SITE_URL http://localhost:3000
          pnpm exec convex env set E2E_TEST_MODE true
          pnpm exec convex dev --once

      # Proves the sequence above actually targeted the local backend, and names
      # what it produced. `convex init` writes .env.local itself, including
      # VITE_CONVEX_URL and VITE_CONVEX_SITE_URL, which is what playwright's
      # config dotenv-loads for the OTP-capture client and what vite reads.
      # VITE_SITE_URL is NOT needed: it is referenced only by wrangler.jsonc.
      - name: Show what was provisioned
        env:
          CONVEX_AGENT_MODE: anonymous
        run: |
          set -euo pipefail
          echo "--- .env.local written by convex init ---"
          cat .env.local
          echo "--- deployment env (names only) ---"
          pnpm exec convex env list | sed -E 's/=.*/=<set>/'

      - name: Playwright
        env:
          CONVEX_AGENT_MODE: anonymous
        run: pnpm e2e

      - name: Keep the report when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            v2/playwright-report
            v2/test-results
          retention-days: 7
